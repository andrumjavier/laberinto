<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laberinto - Lleva la botella a la caneca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= MENÚ DE INICIO ================= -->
  <div id="menu" class="pantalla">
    <h1>♻️ Laberinto Reciclaje</h1>
    <p>Lleva la botella 🥤 hasta la caneca 🗑️ sin tocar las paredes.</p>
    <div class="botones-menu">
      <button onclick="iniciarNivel(1)">🟢 Nivel Fácil</button>
      <button onclick="iniciarNivel(2)">🟡 Nivel Medio</button>
      <button onclick="iniciarNivel(3)">🔴 Nivel Difícil</button>
    </div>
  </div>

  <!-- ================= JUEGO ================= -->
  <div id="juego" class="oculto">
    <h1 id="titulo-nivel">Nivel 1 - Fácil</h1>
    <p id="instrucciones">Arrastra la botella 🥤 hasta la caneca. ¡No toques las paredes!</p>

    <div id="laberinto">
      <!-- Las paredes se generan desde JavaScript según el nivel -->

      <!-- Objeto arrastrable -->
      <div id="objeto">🥤</div>

      <!-- Caneca (meta) -->
      <div id="meta">
        <img src="https://cdn-icons-png.flaticon.com/512/2933/2933263.png" alt="Caneca">
      </div>
    </div>

    <button id="btn-menu" onclick="volverAlMenu()">⬅ Volver al menú</button>
  </div>

  <!-- ================= PANTALLA PERDISTE ================= -->
  <div id="perdiste" class="pantalla oculto">
    <h2>💥 ¡Perdiste!</h2>
    <p>Tocaste una pared</p>
    <button onclick="reiniciarNivel()">🔄 Intentar de nuevo</button>
    <button onclick="volverAlMenu()">🏠 Menú principal</button>
  </div>

  <!-- ================= PANTALLA GANASTE ================= -->
  <div id="ganaste" class="pantalla oculto">
    <h2>🎉 ¡Ganaste!</h2>
    <p id="mensaje-ganaste">¡Llevaste la botella a la caneca!</p>
    <button id="btn-siguiente" onclick="siguienteNivel()">➡ Siguiente nivel</button>
    <button onclick="volverAlMenu()">🏠 Menú principal</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
